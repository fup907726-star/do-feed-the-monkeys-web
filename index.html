<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3F home · 灰窗</title>
  <style>
    :root {
      --bg: #1a1a18;
      --panel: #2a2926;
      --ink: #e8e0d0;
      --dim: #9a9284;
      --amber: #d4a24a;
      --red: #c45c4a;
      --green: #7a9a6a;
      --line: #3f3d38;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; letter-spacing: .04em;
    }
    header b { color: var(--amber); font-weight: 600; }
    #clock { font-variant-numeric: tabular-nums; color: var(--dim); }
    main { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; }
    #roomWrap {
      flex: 1; min-height: 280px; position: relative;
      background: #2a2a28; border: 1px solid #4a4840; border-radius: 8px; overflow: hidden;
    }
    #room { width: 100%; height: 100%; display: block; }
    .hint {
      position: absolute; left: 8px; right: 8px; bottom: 8px;
      font-size: 12px; color: #d8d0c0; background: rgba(0,0,0,.45);
      padding: 6px 8px; border-radius: 4px; pointer-events: none;
    }
    .room-btns { display: flex; gap: 6px; }
    .room-btns button, .row button, .sheet button, #report button {
      flex: 1; background: #241f1a; color: var(--ink);
      border: 1px solid var(--line); padding: 10px 8px; font-size: 13px;
    }
    .room-btns button.primary, .row button.primary { border-color: var(--amber); color: var(--amber); }
    .desk {
      background: linear-gradient(#3a3228, #2a241c);
      border: 1px solid #4a4034;
      border-radius: 8px;
      padding: 8px;
      flex: 1;
      display: flex; flex-direction: column; gap: 8px;
    }
    .screen {
      background: #0c0e0c;
      border: 3px solid #1c1c1a;
      border-radius: 4px;
      min-height: 210px;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas.mon { width: 100%; height: 100%; display: block; }
    .cam-label {
      position: absolute; top: 8px; left: 8px;
      font-size: 11px; color: #c9c4b0; background: rgba(0,0,0,.55);
      padding: 2px 6px; letter-spacing: .06em;
    }
    .rec { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--red); }
    .cams { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .cams button {
      background: #1c1b18; color: var(--ink); border: 1px solid var(--line);
      padding: 8px 4px; font-size: 11px; border-radius: 4px;
    }
    .cams button.on { border-color: var(--amber); color: var(--amber); }
    .row { display: flex; gap: 6px; }
    .sheet, #report, #end {
      background: #f3ead4; color: #2a2418;
      padding: 12px; border-radius: 4px; font-size: 14px; line-height: 1.55;
    }
    .sheet h2, #report h2, #end h2 { margin: 0 0 8px; font-size: 16px; }
    .muted { color: #6a6256; font-size: 12px; }
    label { display: block; margin: 8px 0 4px; font-size: 13px; }
    select { width: 100%; padding: 8px; background: #fff; border: 1px solid #c8bca4; }
    .hidden { display: none !important; }
    footer { padding: 6px 12px 12px; font-size: 11px; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <div id="hdr">3F home · 雾城混凝土 · <b>住处</b></div>
    <div id="clock">18:28</div>
  </header>
  <main>
    <div id="home">
      <div id="roomWrap">
        <canvas id="room"></canvas>
        <div class="hint" id="hint">点西窗木桌坐下。楼梯井在右下，先不走。</div>
      </div>
      <div class="room-btns" style="margin-top:8px">
        <button id="lookBtn">看雾窗</button>
        <button class="primary" id="sitBtn">坐到桌前</button>
      </div>
    </div>
    <div id="intro" class="sheet hidden">
      <h2>灰窗社下发 · GW-OBS-001</h2>
      <p>对象：周凯，顺达物流仓库夜班。有人说他这周在躲催款。</p>
      <p>我们只要<strong>事实</strong>，不要你替他还钱。23:00 前交观察报告。</p>
      <p class="muted">三路已开：东门闸机 / 卸货区 / 宿舍走廊。无室内。不是邻居。</p>
      <div class="row" style="margin-top:10px">
        <button id="standBtn">离开桌子</button>
        <button class="primary" id="startBtn">开屏</button>
      </div>
    </div>
    <div id="desk" class="desk hidden">
      <div class="screen">
        <canvas id="cv" class="mon"></canvas>
        <div class="cam-label" id="camName">CAM-02 卸货区</div>
        <div class="rec">● REC</div>
      </div>
      <div class="cams">
        <button data-cam="gate">闸机</button>
        <button data-cam="dock" class="on">卸货区</button>
        <button data-cam="hall">走廊</button>
      </div>
      <div class="row">
        <button id="skipBtn">时间 +30 分</button>
        <button id="smsBtn">轻喂：匿名短信</button>
        <button class="primary" id="reportBtn">写观察报告</button>
      </div>
      <div class="row">
        <button id="standBtn2">站起来回房间</button>
      </div>
    </div>
    <div id="report" class="hidden">
      <h2>观察报告</h2>
      <p class="muted">三条都填即可交差。对 / 错 / 无法确认都算完成，不要瞎编。</p>
      <label>1. 今晚 23:00 前，周凯有没有回到员工宿舍？</label>
      <select id="q1">
        <option value="">— 选择 —</option>
        <option>有，走廊枪看到进门</option>
        <option>没有</option>
        <option>无法确认</option>
      </select>
      <label>2. 卸货区休息时，有没有接过明显超过一分钟的通话？</label>
      <select id="q2">
        <option value="">— 选择 —</option>
        <option>有，至少一次</option>
        <option>没有看到</option>
        <option>无法确认</option>
      </select>
      <label>3. 有没有出现「刷闸机离开、且当晚未回宿舍」？</label>
      <select id="q3">
        <option value="">— 选择 —</option>
        <option>有</option>
        <option>没有</option>
        <option>无法确认</option>
      </select>
      <div class="row" style="margin-top:12px">
        <button id="backBtn">回监控</button>
        <button class="primary" id="submitBtn">交给灰窗社</button>
      </div>
    </div>
    <div id="end" class="hidden"></div>
  </main>
  <footer>网页测玩 · DJI-114 先出 3F 住处，再坐进单屏。楼梯/院子不下。</footer>
  <script src="app.js"></script>
</body>
</html>
