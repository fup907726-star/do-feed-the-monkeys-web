<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>灰窗 · GW-OBS-001</title>
  <style>
    :root {
      --bg: #1a1a18;
      --panel: #2a2926;
      --ink: #e8e0d0;
      --dim: #9a9284;
      --amber: #d4a24a;
      --red: #c45c4a;
      --green: #7a9a6a;
      --line: #3f3d38;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; letter-spacing: .04em;
    }
    header b { color: var(--amber); font-weight: 600; }
    #clock { font-variant-numeric: tabular-nums; color: var(--dim); }
    main { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; }
    .desk {
      background: linear-gradient(#3a3228, #2a241c);
      border: 1px solid #4a4034;
      border-radius: 8px;
      padding: 8px;
      flex: 1;
      display: flex; flex-direction: column; gap: 8px;
    }
    .screen {
      background: #0c0e0c;
      border: 3px solid #1c1c1a;
      border-radius: 4px;
      min-height: 210px;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .cam-label {
      position: absolute; top: 8px; left: 8px;
      font-size: 11px; color: #c9c4b0; background: rgba(0,0,0,.55);
      padding: 2px 6px; letter-spacing: .06em;
    }
    .rec { position: absolute; top: 8px; right: 8px; font-size: 11px; color: var(--red); }
    .cams { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .cams button {
      background: #1c1b18; color: var(--ink); border: 1px solid var(--line);
      padding: 8px 4px; font-size: 11px; border-radius: 4px;
    }
    .cams button.on { border-color: var(--amber); color: var(--amber); }
    .row { display: flex; gap: 6px; }
    .row button, .sheet button, #report button {
      flex: 1; background: #241f1a; color: var(--ink);
      border: 1px solid var(--line); padding: 10px 8px; font-size: 13px;
    }
    .row button.primary { border-color: var(--amber); color: var(--amber); }
    .sheet, #report, #end {
      background: #f3ead4; color: #2a2418;
      padding: 12px; border-radius: 4px; font-size: 14px; line-height: 1.55;
    }
    .sheet h2, #report h2, #end h2 { margin: 0 0 8px; font-size: 16px; }
    .muted { color: #6a6256; font-size: 12px; }
    label { display: block; margin: 8px 0 4px; font-size: 13px; }
    select { width: 100%; padding: 8px; background: #fff; border: 1px solid #c8bca4; }
    .hidden { display: none !important; }
    footer { padding: 6px 12px 12px; font-size: 11px; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <div>3F home · 靠窗木桌 · <b>单屏</b></div>
    <div id="clock">18:28</div>
  </header>
  <main>
    <div id="intro" class="sheet">
      <h2>灰窗社下发 · GW-OBS-001</h2>
      <p>对象：周凯，顺达物流仓库夜班。有人说他这周在躲催款。</p>
      <p>我们只要<strong>事实</strong>，不要你替他还钱。23:00 前交观察报告。</p>
      <p class="muted">三路已开：东门闸机 / 卸货区 / 宿舍走廊。无室内。不是邻居。</p>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="startBtn">坐到桌前开屏</button>
      </div>
    </div>
    <div id="desk" class="desk hidden">
      <div class="screen">
        <canvas id="cv"></canvas>
        <div class="cam-label" id="camName">CAM-02 卸货区</div>
        <div class="rec">● REC</div>
      </div>
      <div class="cams">
        <button data-cam="gate">闸机</button>
        <button data-cam="dock" class="on">卸货区</button>
        <button data-cam="hall">走廊</button>
      </div>
      <div class="row">
        <button id="skipBtn">时间 +30 分</button>
        <button id="smsBtn">轻喂：匿名短信</button>
        <button class="primary" id="reportBtn">写观察报告</button>
      </div>
    </div>
    <div id="report" class="hidden">
      <h2>观察报告</h2>
      <p class="muted">三条都填即可交差。对 / 错 / 无法确认都算完成，不要瞎编。</p>
      <label>1. 今晚 23:00 前，周凯有没有回到员工宿舍？</label>
      <select id="q1">
        <option value="">— 选择 —</option>
        <option>有，走廊枪看到进门</option>
        <option>没有</option>
        <option>无法确认</option>
      </select>
      <label>2. 卸货区休息时，有没有接过明显超过一分钟的通话？</label>
      <select id="q2">
        <option value="">— 选择 —</option>
        <option>有，至少一次</option>
        <option>没有看到</option>
        <option>无法确认</option>
      </select>
      <label>3. 有没有出现「刷闸机离开、且当晚未回宿舍」？</label>
      <select id="q3">
        <option value="">— 选择 —</option>
        <option>有</option>
        <option>没有</option>
        <option>无法确认</option>
      </select>
      <div class="row" style="margin-top:12px">
        <button id="backBtn">回监控</button>
        <button class="primary" id="submitBtn">交给灰窗社</button>
      </div>
    </div>
    <div id="end" class="hidden"></div>
  </main>
  <footer>网页测玩版 · 只测接单/看枪/交差。不做楼梯与院子。</footer>
  <script>
    const state = { minutes: 18*60+28, cam: "dock", fed: false, seenCall: false, leftGate: false, backHall: false, events: [] };
    const clock = document.getElementById("clock");
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    function hhmm(m) {
      const h = Math.floor(m / 60) % 24;
      const mm = m % 60;
      return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
    }
    function resize() {
      const r = cv.parentElement.getBoundingClientRect();
      cv.width = Math.floor(r.width * devicePixelRatio);
      cv.height = Math.floor(r.height * devicePixelRatio);
    }
    window.addEventListener("resize", resize);
    function drawCam() {
      const w = cv.width, h = cv.height;
      ctx.fillStyle = "#0d120e"; ctx.fillRect(0,0,w,h);
      const t = state.minutes;
      for (let i=0;i<80;i++) {
        ctx.fillStyle = "rgba(180,200,160,0.08)";
        ctx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
      }
      ctx.fillStyle = "#1a2318";
      if (state.cam === "dock") {
        ctx.fillRect(0, h*0.62, w, h*0.38);
        ctx.fillStyle = "#2a2a22";
        ctx.fillRect(w*0.08, h*0.28, w*0.55, h*0.34);
        ctx.fillStyle = "#c9b27a";
        const here = t >= 18*60+30 && t <= 21*60+20 && !(state.leftGate && t > 20*60+40);
        if (here) {
          ctx.fillRect(w*0.62, h*0.46, w*0.08, h*0.22);
          if (t >= 18*60+50 && t <= 19*60+10) {
            ctx.fillStyle = "#8ad0a0";
            ctx.fillRect(w*0.70, h*0.48, 8, 8);
            state.seenCall = true;
          }
        }
      } else if (state.cam === "gate") {
        ctx.fillRect(0, h*0.7, w, h*0.3);
        ctx.fillStyle = "#3a4030";
        ctx.fillRect(w*0.2, h*0.2, w*0.12, h*0.5);
        ctx.fillRect(w*0.68, h*0.2, w*0.12, h*0.5);
        const passing = (t >= 21*60 && t <= 21*60+8) || (state.fed && t >= 20*60+10 && t <= 20*60+18);
        if (passing) {
          ctx.fillStyle = "#c9b27a";
          ctx.fillRect(w*0.46, h*0.48, w*0.07, h*0.2);
          state.leftGate = true;
        }
      } else {
        ctx.fillStyle = "#141816"; ctx.fillRect(0,0,w,h);
        ctx.fillStyle = "#2c2a24";
        ctx.fillRect(w*0.15, h*0.25, w*0.22, h*0.5);
        ctx.fillRect(w*0.62, h*0.25, w*0.22, h*0.5);
        const back = (!state.fed && t >= 21*60+5 && t <= 21*60+20);
        if (back) {
          ctx.fillStyle = "#c9b27a";
          ctx.fillRect(w*0.64, h*0.48, w*0.07, h*0.22);
          state.backHall = true;
        }
      }
      ctx.fillStyle = "#8a9a7a";
      ctx.font = (12 * devicePixelRatio) + "px monospace";
      ctx.fillText("GW · " + hhmm(t) + " · " + state.cam, 16, h - 16);
    }
    function tickClock() {
      clock.textContent = hhmm(state.minutes);
      if (state.minutes >= 23*60) clock.textContent = "23:00 截止";
    }
    document.getElementById("startBtn").onclick = () => {
      document.getElementById("intro").classList.add("hidden");
      document.getElementById("desk").classList.remove("hidden");
      resize(); drawCam();
    };
    document.querySelectorAll(".cams button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".cams button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        state.cam = b.dataset.cam;
        document.getElementById("camName").textContent =
          state.cam === "gate" ? "CAM-01 东门闸机" :
          state.cam === "dock" ? "CAM-02 卸货区" : "CAM-03 宿舍走廊";
        drawCam();
      };
    });
    document.getElementById("skipBtn").onclick = () => {
      if (state.minutes >= 23*60) return;
      state.minutes = Math.min(23*60, state.minutes + 30);
      tickClock(); drawCam();
    };
    document.getElementById("smsBtn").onclick = () => {
      state.fed = true; state.backHall = false;
      alert("短信已出去。他可能更早离开，也可能不敢回宿舍。本单不要求喂。");
    };
    document.getElementById("reportBtn").onclick = () => {
      document.getElementById("desk").classList.add("hidden");
      document.getElementById("report").classList.remove("hidden");
    };
    document.getElementById("backBtn").onclick = () => {
      document.getElementById("report").classList.add("hidden");
      document.getElementById("desk").classList.remove("hidden");
      resize(); drawCam();
    };
    document.getElementById("submitBtn").onclick = () => {
      const a = [q1.value,q2.value,q3.value];
      if (a.some(x => !x)) { alert("三条都要有答案。"); return; }
      document.getElementById("report").classList.add("hidden");
      const end = document.getElementById("end");
      end.classList.remove("hidden");
      const truth = [
        state.backHall ? "镜头里：回过宿舍" : "镜头里：没看到回宿舍",
        state.seenCall ? "镜头里：卸货区有长通话" : "镜头里：没抓住长通话",
        (state.leftGate && !state.backHall) ? "镜头里：离场且未回" : "镜头里：未同时满足离场+未回"
      ];
      end.innerHTML = "<h2>已交 · 低报酬 · 暴露" + (state.fed ? "略升" : "极低") + "</h2><p>你的填写：" + a.join(" ／ ") + "</p><p class='muted'>" + truth.join(" ／ ") + "</p><p>灰窗社不跟你对答案。事实在档案里，下一单另说。</p>";
    };
    tickClock();
  </script>
</body>
</html>
